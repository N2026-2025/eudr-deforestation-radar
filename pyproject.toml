[project]
name = "eudr-deforestation-radar"
version = "0.1.0"
description = "EUDR Deforestation Radar - Supply Chain Compliance & Deforestation Monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.4.0",
    "h3>=4.1.0",
    "planetary-computer>=1.1.0",
    "pystac-client>=0.8.0",
    "duckdb>=1.1.0",
    "duckdb-engine>=0.12.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "cerberus>=1.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.3.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
format.quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"